<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <div name="calculadora">
    <h1>CALCULADORA</h1>
    <input type="text" readonly>
    <br>
    <button onclick="numero(0)">0</button>
    <button onclick="numero(1)">1</button>
    <button onclick="numero(2)">2</button>
    <button onclick="numero(3)">3</button>
    <button onclick="numero(4)">4</button>
    <br>
    <button onclick="numero(5)">5</button>
    <button onclick="numero(6)">6</button>
    <button onclick="numero(7)">7</button>
    <button onclick="numero(8)">8</button>
    <button onclick="numero(9)">9</button>
    <br>
    <button onclick="simbolo('+')">+</button>
    <button onclick="simbolo('-')">-</button>
    <button onclick="simbolo('/')">/</button>
    <button onclick="simbolo('*')">x</button>
    <button onclick="igual()">=</button>
    <button onclick="borrar()">C</button>
    </div>
    <script>
        function numero(num){
            let pantalla = document.getElementsByTagName("input")[0]; 
            pantalla.value+=num;
        }
        function borrar(){
            let pantalla = document.getElementsByTagName("input")[0]; 
            pantalla.value="";
        }
        function simbolo(sim){
             let pantalla = document.getElementsByTagName("input")[0]; 
            pantalla.value+=sim;
        }
        function igual(){
            let pantalla = document.getElementsByTagName("input")[0];
            let operacion = pantalla.value;
            pantalla.value=eval(operacion);
        }
    </script>
</body>
</html>
